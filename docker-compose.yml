version: "3"

services:
  lepro-web:
    build: .
    image: lepro-web
    container_name: lepro-web
    restart: unless-stopped
    # Run as the host user so files the UI writes stay owned by you.
    user: "1000:1000"
    ports:
      - "8081:8081"
    environment:
      # Seed the daily schedule's stock + poll interval until schedule.json
      # exists; after that, edit them in the Schedule tab or the TUI (key c).
      LEPRO_TICKER_AUTOSTART: "IBM"
      LEPRO_TICKER_INTERVAL: "30"   # seconds: 10, 30, 60, or 300
    volumes:
      - .:/app
